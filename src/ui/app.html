<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Taipea</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent!important;overflow:hidden}body{font:17px -apple-system;color:#eee}
#panel{width:100%;height:100%;background:#1c1c20;border:2px solid #3a3a40;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
#scroll{flex:1;min-height:0;overflow-y:auto}
#bar{flex:none;height:64px;display:flex;align-items:center;gap:10px;padding:0 10px 0 18px;background:#2a2a30;border-bottom:1px solid #444;cursor:grab;-webkit-user-select:none;z-index:3}
#bar .t{flex:1;font:700 20px -apple-system}#bar .t small{font:400 14px -apple-system;color:#999;margin-left:10px}
#bar button{height:52px;min-width:72px;font-size:22px}
#tabs{display:flex;gap:8px;padding:12px;background:#111;position:sticky;top:0;z-index:2}
.tab{flex:1;height:64px;border:0;border-radius:12px;background:#333;color:#fff;font:700 20px -apple-system;cursor:pointer}
.tab.on{background:#0a84ff}
section{display:none;padding:14px}section.on{display:block}
button{height:60px;min-width:120px;padding:0 18px;border:0;border-radius:12px;font:700 18px -apple-system;color:#fff;cursor:pointer;background:#3a3a40}
button:hover{filter:brightness(1.25)}.b{background:#0a84ff}.g{background:#34c759}.r{background:#ff453a}.y{background:#ff9f0a}
input[type=text],input[type=number],textarea{font:18px -apple-system;min-height:60px;padding:14px;border-radius:10px;border:1px solid #555;background:#2a2a30;color:#fff}
.e{background:#2c2c32;border-radius:12px;padding:14px;margin-bottom:12px}.h{color:#999;font-size:14px}
.x{font-size:19px;margin:8px 0;white-space:pre-wrap}
.sty{margin-top:10px}.sty .opt{min-width:110px}.sty .lbl{width:100%;color:#999;font-size:14px}
.e.busy .sty .opt{opacity:.4;pointer-events:none}.conv{color:#ffcc00;font-weight:700;font-size:18px}.raw{color:#aaa;font-size:15px;margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:#2c2c32;border-radius:12px;padding:16px;margin-bottom:12px}.card h3{margin:0 0 10px}
.opt{flex:1;min-width:130px}.opt.on{background:#0a84ff;outline:3px solid #fff}
.m{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#24242a;border-radius:10px;padding:10px 12px;margin:8px 0}
.m small{color:#aaa;display:block;font-size:14px}.prog{color:#ffcc00;font-weight:700}
/* Size: compact scales the whole UI via one variable; the Size card stays full size */
:root{--z:1}body.compact{--z:.65}#bar,#inner{zoom:var(--z)}
body.compact #sizecard,body.compact #langcard{zoom:calc(1/var(--z))}
.big{font:700 22px -apple-system;margin:4px 0}.kd{background:#24242a;border-radius:10px;padding:12px;margin:8px 0}
</style></head><body><div id=panel>
<div id=bar><div class=t>🎙 Taipea<small id=s_drag></small></div><button id=b_hide onclick="send({cmd:'mini'})">—</button><button id=b_close class=r onclick="send({cmd:'close'})">✕</button></div>
<div id=scroll><div id=inner>
<div id=tabs><button class="tab on" data-t=hist id=t_hist></button><button class=tab data-t=set id=t_set></button><button class=tab data-t=mod id=t_mod></button><button class="tab g" id=t_dict onclick="send({cmd:'dictate'})" style="flex:.8"></button></div>
<section id=hist class=on>
 <div class=row style="margin-bottom:12px"><input id=q type=text style="flex:1" oninput="renderHist()"><button class=r id=clr onclick="clr()"></button></div>
 <div id=hl></div></section>
<section id=set><div id=sl></div></section>
<section id=mod><div id=ml></div></section>
</div></div></div>
<script>
// Interface strings. Keep both languages with the same keys (tests/run.lua checks this).
var L={
en:{drag:'drag here to move',hide:'Hide window',close:'Close window',hist:'History',set:'Settings',mod:'Models',dict:'🎙 Dictate',
 search:'Search…',searchLbl:'Search history',clear:'Clear all',clearSure:'Tap again to DELETE ALL',none:'No dictations yet.',noneMatch:'No dictations match.',
 cleaned:'cleaned',raw:'raw',rawLbl:'Raw:',converting:'⏳ Converting to %s…',copy:'Copy',paste:'Paste',copyRaw:'Copy raw',del:'Delete',convertTo:'Convert raw text to:',
 light:'Light',paragraphs:'Paragraph',bullets:'Bullets',formal:'Formal',
 lang:'Interface language',langAuto:'Auto (Mac: %s)',english:'English',spanish:'Español',
 size:'Size',normal:'Normal',compact:'Compact',login:'Open at login',on:'On',off:'Off',
 loginOk:'Dictation shortcut is ready after every login',reg:' ✓ (registered)',notReg:' ⚠ not registered yet',
 loginWarn:'⚠ When off, dictation won\'t work after restarting until you open Hammerspoon or the Taipea app.',showLogin:'Show window at login',
 keys:'Shortcuts',keyFmt:'To change one, type it like ctrl+alt+space (keys: cmd, ctrl, alt, shift + a key) and press Save.',
 kToggle:'Start / stop and paste',kMode:'Cleanup on / off (raw)',kHist:'Open this window',def:'Default: %s',save:'Save',resetKeys:'Reset shortcuts to defaults',
 cleanup:'Cleanup (grammar fix)',offRaw:'Off (raw)',style:'Style',sLight:'Light fix',sPar:'Paragraphs',sBul:'Bullet points',sFor:'Formal',
 dlang:'Dictation language',dAuto:'Auto (EN/ES mix)',after:'After stopping',pasteCur:'Paste at cursor',copyOnly:'Copy only',
 auto:'Auto-stop on silence',silSec:'Silence seconds',sens:'Sensitivity threshold',sensHint:'Higher threshold = treats more background noise as silence.',
 overlay:'Recording panel',overlayHint:'The floating panel with big Stop & Paste, Copy only and Cancel buttons.',resetOv:'Reset panel position',
 setup:'⚠ Setup needed',wTitle:'Speech model (Whisper)',wHint:'Saved in ~/Library/Application Support/Taipea/models',lTitle:'Cleanup model (Ollama)',
 nowUsing:'Now using: ',noModel:'⚠ No cleanup model is running. Raw text still works. Start Ollama (brew services start ollama) and download a model below.',
 noOllama:'⚠ Ollama is not installed, so cleanup and styles are off. Raw dictation still works. Install it with: brew install ollama',
 inUse:'✓ In use',use:'Use',download:'Download',refresh:'Refresh list'},
es:{drag:'arrastra aquí para mover',hide:'Ocultar ventana',close:'Cerrar ventana',hist:'Historial',set:'Ajustes',mod:'Modelos',dict:'🎙 Dictar',
 search:'Buscar…',searchLbl:'Buscar en el historial',clear:'Borrar todo',clearSure:'Toca otra vez para BORRAR TODO',none:'Aún no hay dictados.',noneMatch:'Ningún dictado coincide.',
 cleaned:'corregido',raw:'original',rawLbl:'Original:',converting:'⏳ Convirtiendo a %s…',copy:'Copiar',paste:'Pegar',copyRaw:'Copiar original',del:'Borrar',convertTo:'Convertir el texto original a:',
 light:'Ligero',paragraphs:'Párrafos',bullets:'Viñetas',formal:'Formal',
 lang:'Idioma de la interfaz',langAuto:'Automático (Mac: %s)',english:'English',spanish:'Español',
 size:'Tamaño',normal:'Normal',compact:'Compacto',login:'Abrir al iniciar sesión',on:'Sí',off:'No',
 loginOk:'El atajo de dictado queda listo en cada inicio de sesión',reg:' ✓ (registrado)',notReg:' ⚠ aún no registrado',
 loginWarn:'⚠ Si está apagado, el dictado no funciona después de reiniciar hasta que abras Hammerspoon o la app Taipea.',showLogin:'Mostrar la ventana al iniciar sesión',
 keys:'Atajos',keyFmt:'Para cambiar uno, escríbelo como ctrl+alt+space (teclas: cmd, ctrl, alt, shift + una tecla) y presiona Guardar.',
 kToggle:'Empezar / parar y pegar',kMode:'Corrección sí / no (original)',kHist:'Abrir esta ventana',def:'De fábrica: %s',save:'Guardar',resetKeys:'Restablecer los atajos de fábrica',
 cleanup:'Corrección (gramática)',offRaw:'No (original)',style:'Estilo',sLight:'Ligero',sPar:'Párrafos',sBul:'Viñetas',sFor:'Formal',
 dlang:'Idioma del dictado',dAuto:'Automático (mezcla EN/ES)',after:'Al parar',pasteCur:'Pegar en el cursor',copyOnly:'Solo copiar',
 auto:'Parar solo con el silencio',silSec:'Segundos de silencio',sens:'Sensibilidad',sensHint:'Un valor más alto toma más ruido de fondo como silencio.',
 overlay:'Panel de grabación',overlayHint:'El panel flotante con los botones grandes Parar y pegar, Solo copiar y Cancelar.',resetOv:'Restablecer la posición del panel',
 setup:'⚠ Falta configurar algo',wTitle:'Modelo de voz (Whisper)',wHint:'Se guarda en ~/Library/Application Support/Taipea/models',lTitle:'Modelo de corrección (Ollama)',
 nowUsing:'Usando ahora: ',noModel:'⚠ No hay un modelo de corrección corriendo. El texto original sigue funcionando. Inicia Ollama (brew services start ollama) y descarga un modelo abajo.',
 noOllama:'⚠ Ollama no está instalado, así que la corrección y los estilos están apagados. El dictado original sigue funcionando. Instálalo con: brew install ollama',
 inUse:'✓ En uso',use:'Usar',download:'Descargar',refresh:'Actualizar lista'}};
var S={},LANG='en';
function t(k,a){var s=(L[LANG]&&L[LANG][k])||L.en[k]||k;return a!==undefined?s.replace('%s',a):s}
function send(o){webkit.messageHandlers.taipea.postMessage(o)}
document.getElementById('bar').addEventListener('mousedown',e=>{if(e.button===0&&!e.target.closest('button')){e.preventDefault();send({cmd:'dragStart'})}});
document.querySelectorAll('.tab[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab[data-t]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
 document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==b.dataset.t))});
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function staticText(){document.documentElement.lang=LANG;
 var set=(id,k)=>{document.getElementById(id).textContent=t(k)};
 set('s_drag','drag');set('t_hist','hist');set('t_set','set');set('t_mod','mod');set('t_dict','dict');
 var c=document.getElementById('clr');if(!c.dataset.a)c.textContent=t('clear');
 var q=document.getElementById('q');q.placeholder=t('search');q.setAttribute('aria-label',t('searchLbl'));
 [['b_hide','hide'],['b_close','close']].forEach(x=>{var b=document.getElementById(x[0]);b.title=t(x[1]);b.setAttribute('aria-label',t(x[1]))})}
function fin(e){return e.cleaned||e.raw}
var PEND={};
function restyle(i,st){PEND[i]=st;renderHist();send({cmd:'restyle',i:i,style:st})}
function renderHist(){var q=document.getElementById('q').value.toLowerCase(),h='';
 (S.history||[]).forEach((e,i)=>{if(q&&!((e.raw||'')+' '+(e.cleaned||'')).toLowerCase().includes(q))return;
  var cv=(S.conv||{})[i+1]||PEND[i+1];
 h+='<div class="e'+(cv?' busy':'')+'"><div class=h>'+esc(e.time)+(e.cleaned?' · '+(e.style?t(e.style):t('cleaned')):' · '+t('raw'))+'</div>'+
 (cv?'<div class=conv>'+esc(t('converting',t(cv)))+'</div>':'')+'<div class=x>'+esc(fin(e))+'</div>'+
 (e.cleaned&&e.cleaned!=e.raw?'<div class=raw><b>'+t('rawLbl')+'</b> '+esc(e.raw)+'</div>':'')+
 '<div class=row><button class=b onclick="send({cmd:\'copy\',i:'+(i+1)+'})">'+t('copy')+'</button><button class=g onclick="send({cmd:\'paste\',i:'+(i+1)+'})">'+t('paste')+'</button>'+
 (e.cleaned&&e.cleaned!=e.raw?'<button onclick="send({cmd:\'copyRaw\',i:'+(i+1)+'})">'+t('copyRaw')+'</button>':'')+
 '<button class=r onclick="send({cmd:\'del\',i:'+(i+1)+'})">'+t('del')+'</button></div>'+
 '<div class="row sty"><span class=lbl>'+t('convertTo')+'</span>'+['light','paragraphs','bullets','formal'].map(st=>'<button class="opt'+(e.cleaned&&e.style==st?' on':'')+'" onclick="restyle('+(i+1)+',\''+st+'\')">'+t(st)+'</button>').join('')+'</div></div>'});
 document.getElementById('hl').innerHTML=h||'<p>'+t(q?'noneMatch':'none')+'</p>'}
function opts(key,list){return '<div class=row>'+list.map(o=>'<button class="opt'+(S.cfg[key]==o[0]?' on':'')+'" onclick="set(\''+key+'\','+JSON.stringify(o[0]).replace(/"/g,'&quot;')+')">'+o[1]+'</button>').join('')+'</div>'}
function set(k,v){send({cmd:'set',key:k,value:v})}
function renderSet(){var c=S.cfg,h='';
 h+='<div class=card id=langcard><h3>'+t('lang')+'</h3>'+opts('uiLanguage',[['auto',t('langAuto',S.sysLang=='es'?'Español':'English')],['en','English'],['es','Español']])+'</div>';
 h+='<div class=card id=sizecard><h3>'+t('size')+'</h3>'+opts('uiSize',[['normal',t('normal')],['compact',t('compact')]])+'</div>';
 h+='<div class=card><h3>'+t('keys')+'</h3>'+
 [['toggleKey','kToggle'],['modeKey','kMode'],['historyKey','kHist']].map(k=>'<div class=kd><div>'+t(k[1])+'</div><div class=big>'+esc(S.keyLabels[k[0]])+'</div>'+
  (S.keyLabels[k[0]]!=S.defaultKeys[k[0]]?'<p class=h>'+esc(t('def',S.defaultKeys[k[0]]))+'</p>':'')+
  '<div class=row><input type=text id="k_'+k[0]+'" aria-label="'+esc(t(k[1]))+'" value="'+esc(S.keys[k[0]])+'" style="flex:1"><button class=b onclick="set(\''+k[0]+'\',document.getElementById(\'k_'+k[0]+'\').value)">'+t('save')+'</button></div></div>').join('')+
 '<p class=h>'+t('keyFmt')+'</p><button class=y onclick="send({cmd:\'resetKeys\'})">'+t('resetKeys')+'</button></div>';
 h+='<div class=card><h3>'+t('cleanup')+'</h3>'+opts('cleanup',[[true,t('on')],[false,t('offRaw')]])+'<h3 style="margin-top:14px">'+t('style')+'</h3>'+opts('style',[['light',t('sLight')],['paragraphs',t('sPar')],['bullets',t('sBul')],['formal',t('sFor')]])+'</div>';
 h+='<div class=card><h3>'+t('dlang')+'</h3>'+opts('language',[['auto',t('dAuto')],['en','English'],['es','Español']])+'</div>';
 h+='<div class=card><h3>'+t('after')+'</h3>'+opts('defaultAction',[['paste',t('pasteCur')],['copy',t('copyOnly')]])+'</div>';
 h+='<div class=card><h3>'+t('overlay')+'</h3><p class=h>'+t('overlayHint')+'</p>'+opts('showOverlay',[[true,t('on')],[false,t('off')]])+'<div class=row style="margin-top:10px"><button class=y onclick="send({cmd:\'resetOverlay\'})">'+t('resetOv')+'</button></div></div>';
 h+='<div class=card><h3>'+t('login')+'</h3>'+opts('openAtLogin',[[true,t('on')],[false,t('off')]])+
 (c.openAtLogin?'<p class=h>'+t('loginOk')+(S.autoLaunch?t('reg'):t('notReg'))+'</p>':'<p class=h style="color:#ff9f0a">'+t('loginWarn')+'</p>')+
 '<h3 style="margin-top:14px">'+t('showLogin')+'</h3>'+opts('showAtLogin',[[true,t('on')],[false,t('off')]])+'</div>';
 h+='<div class=card><h3>'+t('auto')+'</h3>'+opts('autoStop',[[true,t('on')],[false,t('off')]])+
 '<div class=row style="margin-top:10px"><span>'+t('silSec')+'</span><button onclick="set(\'silenceSeconds\','+Math.max(1,c.silenceSeconds-0.5)+')">−</button><b style="font-size:24px">'+c.silenceSeconds+'</b><button onclick="set(\'silenceSeconds\','+(c.silenceSeconds+0.5)+')">+</button></div>'+
 '<div class=row style="margin-top:10px"><span>'+t('sens')+'</span>'+['0.5%','1%','1.5%','3%','5%'].map(x=>'<button class="opt'+(c.silenceThreshold==x?' on':'')+'" onclick="set(\'silenceThreshold\',\''+x+'\')">'+x+'</button>').join('')+'</div><p class=h>'+t('sensHint')+'</p></div>';
 document.getElementById('sl').innerHTML=h}
function renderMod(){var h='';
 if(S.missing)h+='<div class=card style="border:2px solid #ff9f0a"><h3>'+t('setup')+'</h3><p>'+esc(S.missing)+'</p></div>';
 h+='<div class=card><h3>'+t('wTitle')+'</h3><p class=h>'+t('wHint')+'</p>';
 (S.whisperModels||[]).forEach(m=>{h+='<div class=m><div><b>'+esc(m.name)+'</b><small>'+esc(m.size)+' · '+esc(m.note)+'</small></div>'+
 (m.installed?(S.cfg.modelName==m.file?'<button class=g>'+t('inUse')+'</button>':'<button class=b onclick="set(\'modelName\',\''+m.file+'\')">'+t('use')+'</button>'):
 (S.dl[m.file]?'<span class=prog>'+esc(S.dl[m.file])+'</span>':'<button class=y onclick="send({cmd:\'dlWhisper\',file:\''+m.file+'\'})">'+t('download')+'</button>'))+'</div>'});
 h+='</div><div class=card><h3>'+t('lTitle')+'</h3>'+(S.ollama?(S.activeModel?'<p class=h>'+t('nowUsing')+'<b>'+esc(S.activeModel)+'</b></p>':'<p class=h style="color:#ff9f0a">'+t('noModel')+'</p>'):'<p class=h style="color:#ff9f0a">'+t('noOllama')+'</p>');
 (S.llmModels||[]).forEach(m=>{h+='<div class=m><div><b>'+esc(m.name)+'</b><small>'+esc(m.size)+' · '+esc(m.note)+'</small></div>'+
 (m.installed?(S.cfg.ollamaModel==m.name?'<button class=g>'+t('inUse')+'</button>':'<button class=b onclick="set(\'ollamaModel\',\''+m.name+'\')">'+t('use')+'</button>'):
 (S.dl[m.name]?'<span class=prog>'+esc(S.dl[m.name])+'</span>':'<button class=y onclick="send({cmd:\'dlLLM\',name:\''+m.name+'\'})">'+t('download')+'</button>'))+'</div>'});
 h+='</div><button onclick="send({cmd:\'refresh\'})">'+t('refresh')+'</button>';document.getElementById('ml').innerHTML=h}
function clr(){var b=document.getElementById('clr');if(b.dataset.a){send({cmd:'clearHistory'});b.dataset.a='';b.textContent=t('clear')}else{b.dataset.a=1;b.textContent=t('clearSure');setTimeout(()=>{b.dataset.a='';b.textContent=t('clear')},4000)}}
function render(d){S=d;PEND={};LANG=(d.lang=='es')?'es':'en';document.body.classList.toggle('compact',(d.cfg&&d.cfg.uiSize)=='compact');staticText();renderHist();renderSet();renderMod()}
staticText();
if(window.webkit)send({cmd:'refresh'});
</script></body></html>
