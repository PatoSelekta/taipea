*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent!important;overflow:hidden}

#scroll::-webkit-scrollbar{width:16px}#scroll::-webkit-scrollbar-track{background:transparent}#scroll::-webkit-scrollbar-thumb{background:var(--sb);border-radius:8px;border:3px solid var(--panel)}
#panel{width:100%;height:100%;background:var(--panel);border:2px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
/* header + tabs live OUTSIDE the scroller: they never move, never get pushed down by banners */
#chrome{flex:none;background:var(--bar);border-bottom:2px solid var(--bd2);zoom:var(--z);position:relative;z-index:3}
#bar{display:flex;align-items:center;gap:16px;padding:8px 10px 16px 14px}

#grip .dots{font-size:22px;color:var(--mut);letter-spacing:-2px}
#grip .t{font:700 20px/1.2 -apple-system,BlinkMacSystemFont,Inter,sans-serif}#grip .t small{display:block;font:500 14px/1.2 -apple-system,BlinkMacSystemFont,Inter,sans-serif;color:var(--mut)}
#bar button{min-width:76px;font-size:22px}
#tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);padding:0 var(--pad) var(--pad)}
@media (max-width:640px){#grip .t small{display:none}}
@media (max-width:480px){.tab .ti{display:none}}
.tab{min-height:64px;background:var(--tab);color:var(--tabtx);font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px}
.tab[aria-selected=true]{background:var(--acc);color:var(--acctx);border-color:var(--ring);box-shadow:inset 0 -6px 0 var(--ring)}
#scroll{flex:1;min-height:0;overflow-y:auto}
#inner{zoom:var(--z);padding:var(--pad)}
section{display:none}section.on{display:block}
button{min-height:60px;height:auto;min-width:60px;padding:10px 18px;border:2px solid var(--line);border-radius:var(--r);font:700 var(--fs)/1.2 -apple-system,BlinkMacSystemFont,Inter,sans-serif;color:var(--btntx);background:var(--btn);cursor:pointer;white-space:normal;overflow-wrap:anywhere;text-align:center}
button:hover{filter:brightness(1.15)}body.lt button:hover{filter:brightness(.94)}button:active{filter:brightness(.85)}
.b{background:var(--acc);color:var(--acctx);border-color:transparent}.g{background:var(--go);color:#fff;border-color:transparent}.r{background:var(--stop);color:#fff;border-color:transparent}.y{background:var(--amber);color:#fff;border-color:transparent}
.dz{background:transparent;color:var(--dtx);border:2px solid var(--dtx)}
body:not(.cl) .cpy{background:#0A6CD6;color:#fff}
button:disabled,button[aria-disabled=true]{opacity:1;color:var(--mut);background:transparent;border:2px dashed var(--line);pointer-events:none}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
input[type=text],input[type=number],input[type=search],textarea{font:var(--fs) -apple-system,BlinkMacSystemFont,Inter,sans-serif;min-height:60px;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--input);color:var(--tx);width:100%}
input[type=search]{-webkit-appearance:none;appearance:none}input::placeholder{color:var(--mut);opacity:1}
.card,.e{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:var(--pad);margin-bottom:var(--gap)}
.card h3{margin:0 0 6px;font-size:20px;line-height:1.25}.card h3+.opts,.card h3+.row{margin-top:10px}
.h{color:var(--mut);font-size:var(--fsh);line-height:1.45;margin:4px 0 12px;max-width:68ch}
.big{font:700 22px -apple-system,BlinkMacSystemFont,Inter,sans-serif;margin:4px 0}
.row{display:flex;gap:var(--gap);flex-wrap:wrap;align-items:center}.row>button{flex:1 1 180px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:var(--gap)}
.opt{min-height:60px;line-height:1.25}
.opt small{display:block;font-size:14px;font-weight:600;opacity:.9;margin-top:3px}
.opt[aria-pressed=true]{background:var(--acc);color:var(--acctx);border-color:var(--ring);box-shadow:0 0 0 3px var(--ring)}
.kd{background:var(--inner);border-radius:12px;padding:12px;margin:10px 0}
.m{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--gap);align-items:center;background:var(--inner);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
.m b{font-size:var(--fsx)}.m small{color:var(--mut);display:block;font-size:var(--fsh);margin-top:2px}.m .act{min-width:150px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
@media (max-width:560px){.m{grid-template-columns:1fr}.m .act{min-width:0}}
.badge{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:8px 16px;border-radius:999px;border:2px solid var(--gotx);color:var(--gotx);font-weight:700}
.pbar{height:14px;border-radius:7px;background:var(--panel);border:1px solid var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc)}
.prog{font-weight:700;color:var(--tx)}.err{color:var(--warn);font-weight:700}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:var(--gap);margin:8px 0}
.sw{height:128px;min-width:0;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--inner);font-size:16px;line-height:1.15}
.sw.on{background:var(--acc);color:var(--acctx);border-color:var(--ring);box-shadow:0 0 0 3px var(--ring)}
.pv{width:64px;height:64px;flex:none;border-radius:50%;border:4px solid;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.45)}.pv svg{width:52%;height:52%}
.cc{display:flex;flex-wrap:wrap;gap:var(--gap);align-items:center;margin:10px 0}.cc .big{flex:1 1 100%}
.cc input[type=color]{width:110px;height:64px;padding:2px;border:2px solid var(--line);border-radius:12px;background:var(--input);cursor:pointer}.cc input[type=text]{flex:1 1 140px;width:auto}
.wr{display:grid;grid-template-columns:1fr 1fr auto;gap:var(--gap);margin:10px 0;align-items:center}.wh span{color:var(--mut);font-size:var(--fsh)}
@media (max-width:560px){.wr{grid-template-columns:1fr 1fr}.wr button{grid-column:1/-1}}
details>summary{min-height:60px;display:flex;align-items:center;gap:8px;font-size:var(--fsh);font-weight:600;color:var(--tx);cursor:pointer;border:2px dashed var(--line);border-radius:12px;padding:0 16px;margin-top:10px;list-style:none}details>summary::before{content:'▸';font-size:18px}details[open]>summary::before{content:'▾'}
/* History */
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--mut);font-size:var(--fsh)}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--tx);font-size:14px;font-weight:600}
.x{font-size:var(--fsx);line-height:1.45;margin:8px 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.x.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);margin-top:12px}
.more{margin-top:var(--gap);padding:var(--pad);background:var(--inner);border-radius:12px}
.more .raw{color:var(--tx);font-size:var(--fsh);white-space:pre-wrap;margin:4px 0 12px}.lbl{color:var(--mut);font-size:var(--fsh);margin:14px 0 8px}
.danger{margin-top:24px;padding-top:16px;border-top:2px dashed var(--line)}
.ask{font-weight:700;margin:12px 0}
.conv{color:var(--warn);font-weight:700}
/* Settings */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:var(--gap)}
.tile{min-height:96px;display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px}
.tile .ic{font-size:30px;flex:none}.tile span{display:block}.tile small{display:block;font-weight:500;font-size:15px;color:var(--mut);margin-top:4px}
.tile:hover small{color:inherit}
.gh{display:flex;flex-wrap:wrap;gap:var(--gap);align-items:center;margin-bottom:var(--gap)}.gh h2{margin:4px 0 0;font-size:24px;flex:1 1 100%}
.gt{font-size:22px;margin:22px 0 10px}
.pl{flex:1;min-height:72px;font-size:20px}
.sa{min-height:60px;background:transparent;border-style:dashed;width:100%}body.compact .sa{min-height:28px;width:auto}
/* ===== Standard layout (uiSize 'compact'): regular Mac-app density, explicit opt-in. The 60 px rule does not apply here,
   except the layout switch itself (44 px) so anyone who lands here by accident can get back to Accessible. ===== */
body.compact{--gap:8px;--pad:12px;--fs:13px;--fsh:12px;--fsx:13.5px;--r:7px}
body.compact #panel{border-width:1px;border-radius:12px}
body.compact button{min-height:28px;min-width:0;padding:4px 12px;border-width:1px;border-radius:6px;font-weight:600;line-height:1.25}
body.compact :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
body.compact #chrome{border-bottom-width:1px}
body.compact #bar{min-height:44px;padding:4px 8px 4px 10px;gap:6px}
body.compact #grip{min-height:36px;padding:0 4px;gap:6px;border-radius:6px}
body.compact #grip .dots{font-size:14px}
body.compact #grip .t{font-size:14px;display:flex;align-items:baseline;gap:8px}body.compact #grip .t small{display:inline;font-size:11.5px}
body.compact #bar button{min-width:32px;min-height:28px;font-size:13px;padding:2px 8px}
body.compact #tabs{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 10px 10px}
body.compact .tab{min-height:32px;font-size:13px;padding:4px 8px;gap:6px}
body.compact .tab[aria-selected=true]{box-shadow:inset 0 -3px 0 var(--ring)}
body.compact input[type=text],body.compact input[type=number],body.compact input[type=search],body.compact textarea{font-size:13px;min-height:30px;padding:5px 10px;border-radius:6px;border-width:1px}
body.compact .card,body.compact .e{border-radius:10px;padding:12px;margin-bottom:8px}
body.compact .card h3{font-size:14px;margin:0 0 3px}body.compact .card h3+.opts,body.compact .card h3+.row{margin-top:6px}
body.compact .h{font-size:12px;line-height:1.4;margin:2px 0 8px}
body.compact .big{font-size:15px}
body.compact .row{gap:6px}body.compact .row>button{flex:0 1 auto}
body.compact .opts{grid-template-columns:repeat(auto-fit,minmax(min(100%,96px),1fr));gap:6px}
body.compact .opt{min-height:28px}body.compact .opt small{font-size:11px;margin-top:1px}
body.compact .opt[aria-pressed=true]{box-shadow:0 0 0 1px var(--ring)}
body.compact .kd{padding:8px 10px;border-radius:8px;margin:6px 0}
body.compact .m{padding:8px 10px;border-radius:8px;margin:6px 0;gap:8px}body.compact .m .act{min-width:110px;gap:6px}
body.compact .badge{min-height:24px;padding:2px 10px;font-size:12px;border-width:1px}
body.compact .pbar{height:8px}
body.compact .sws{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin:6px 0}
body.compact .sw{height:76px;font-size:12px;gap:4px;padding:6px 4px}body.compact .sw.on{box-shadow:0 0 0 2px var(--ring)}
body.compact .pv{width:34px;height:34px;border-width:3px}
body.compact .cc{gap:6px;margin:6px 0}body.compact .cc input[type=color]{width:60px;height:30px;border-width:1px;border-radius:6px}
body.compact .wr{gap:6px;margin:6px 0}
body.compact details>summary{min-height:30px;font-size:12px;padding:0 10px;border-width:1px;border-radius:6px;margin-top:6px}body.compact details>summary::before{font-size:12px}
body.compact .meta{gap:6px}body.compact .chip{font-size:11px;padding:0 8px}
body.compact .x{font-size:13.5px;margin:6px 0 2px}
body.compact .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}body.compact .acts>button{flex:0 0 auto}
body.compact .more{margin-top:8px;padding:10px;border-radius:8px}body.compact .more .raw{margin:2px 0 8px}body.compact .lbl{margin:10px 0 6px}
body.compact .danger{margin-top:14px;padding-top:10px;border-top-width:1px}body.compact .ask{margin:8px 0}
body.compact .tiles{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:6px}
body.compact .tile{min-height:46px;padding:6px 10px;gap:10px}
body.compact .tile .ic{font-size:18px}body.compact .tile small{font-size:11.5px;margin-top:1px;font-weight:500}
body.compact .gh{gap:8px;margin-bottom:8px}body.compact .gh h2{font-size:17px;margin:2px 0 0}body.compact .gh>button{flex:0 0 auto!important}
body.compact .gt{font-size:15px;margin:14px 0 6px}
body.compact #scroll::-webkit-scrollbar{width:10px}body.compact #scroll::-webkit-scrollbar-thumb{border-width:2px}

body.compact #sizecard .opt{min-height:44px;font-size:14px}

body.hc .card,body.hc .e,body.hc .m,body.hc .kd,body.hc .more{border:2px solid var(--tx)}
body.hc button,body.hc input[type=text],body.hc .cc input[type=color]{border-width:3px}body.hc #chrome{border-bottom:3px solid var(--tx)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

 '<div class=card><h3>'+t('after')+'</h3>'+opts('defaultAction',[['paste',t('pasteCur')],['copy',t('copyOnly')]])+'</div>'+
 '<div class=card><h3>'+t('whisperGuard')+'</h3><p class=h>'+t('whisperGuardHint')+'</p>'+opts('whisperGuard',[[true,t('on')],[false,t('off')]])+'</div>'+autoCard()}
function onoff(v){return v?t('on'):t('off')}
function micName(){var c=S.cfg,m=(S.mics||[]).filter(x=>x.uid==c.inputDevice)[0];return m?m.name:t('micDefault')+' ('+(S.micDefault||'?')+')'}
var GN={dict:'gdict',mic:'gmic',look:'glook',fab:'gfab',voice:'gvoice',keys:'gkeys',words:'gwords',app:'gapp'};
var G=[['dict','🗣',dictCards,function(c){return ({auto:t('dAuto'),en:'English',es:'Español'})[c.language]+' · '+(c.cleanup?t(stKey(c.style)):t('offRaw'))+' · '+(c.defaultAction=='copy'?t('copyOnly'):t('pasteCur'))}],
 ['mic','🎤',function(){return micCard()+permCard()},function(){return micName()}],
 ['look','🎨',function(){return langCard()+sizeCard()+lookCard()+colorCard()},function(c){return t(c.uiSize=='compact'?'szCompact':'szNormal')+' · Aa '+t(({normal:'tsNormal',large:'tsLarge',xlarge:'tsXL'})[c.textSize]||'tsNormal')+' · '+t(thKey({id:c.floatingTheme}))}],
 ['fab','⭕',recCard,function(c){return onoff(c.floatButton)+(c.floatButton&&c.fabSize?' · '+c.fabSize+' px · '+(c.fabOpacity||100)+' %':'')}],
 ['voice','👂',voiceCard,function(c){return onoff(c.voiceControl)}],
 ['keys','⌨️',keysCard,function(){return t('kToggle')+': '+((S.keyLabels||S.keysP||{}).toggleKey||'')}],
 ['words','📝',wordsCard,function(c){return t('words0',(c.customWords||[]).length)}],
 ['app','⬆️',function(){return loginCard()+updCard()},function(c){return 'v'+((S.upd||{}).cur||'')+' · '+t('login')+': '+onoff(c.openAtLogin)}]];
function openG(id){UI.setg=id;renderSet();document.getElementById('scroll').scrollTop=0}
function renderSet(){var c=S.cfg,h='',q=(UI.sq||'').trim().toLowerCase();
 if(q){G.forEach(function(g){h+='<div class=sg><h2 class=gt>'+g[1]+' '+t(GN[g[0]])+'</h2>'+g[2]()+'</div>'})}
 else if(!UI.setg){h='<div class=tiles>'+G.map(function(g){return '<button class=tile onclick="openG(\''+g[0]+'\')"><span class=ic aria-hidden=true>'+g[1]+'</span><span><span>'+t(GN[g[0]])+'</span><small>'+esc(g[3](c))+'</small></span></button>'}).join('')+'</div>'}
 else{var g=G.filter(function(x){return x[0]==UI.setg})[0];h='<div class=gh><button onclick="UI.setg=null;renderSet()" style="flex:0 1 260px">'+t('allSet')+'</button><h2>'+g[1]+' '+t(GN[g[0]])+'</h2></div>'+g[2]()}
 var sl=document.getElementById('sl');sl.innerHTML=h;
 if(q){var any=false;sl.querySelectorAll('.sg').forEach(function(sg){var vis=0;sg.querySelectorAll('.card').forEach(function(cd){var m=cd.textContent.toLowerCase().indexOf(q)>=0;cd.style.display=m?'':'none';if(m)vis++});sg.style.display=vis?'':'none';if(vis)any=true});
  if(!any)sl.innerHTML='<p>'+esc(t('noSetMatch',UI.sq))+'</p>'}}
function isDlFail(st){return st&&(/^Failed|^Falló/.test(String(st)))}
function mrow(m,key,inUse,cmdUse,cmdDl){var st=(S.dl||{})[key],fail=isDlFail(st),pct=parseFloat(st),name=String(m.name).replace(/ \(download\)$/,''),a;
 if(m.installed)a=inUse?'<span class=badge role=status>'+t('inUse')+'</span>':'<button class=b onclick="set(\''+cmdUse+'\',\''+esc(key)+'\')">'+t('use')+'</button>';
 else if(st&&!fail)a='<div role=progressbar aria-valuemin=0 aria-valuemax=100 aria-valuenow='+(pct||0)+' aria-label="'+esc(name)+'"><div class=prog>'+esc(t('dling',st))+'</div><div class=pbar><i style="width:'+(pct||0)+'%"></i></div></div>';
 else a=(fail?'<div class=err>'+esc(t('dlFail',String(st).replace(/^Failed:?\s*|^Falló:?\s*/,'')))+'</div>':'')+'<button class=y onclick="send('+cmdDl+')">'+(fail?t('retry'):t('download'))+'</button>';
 return '<div class=m><div><b>'+esc(name)+'</b><small>'+esc(m.size)+(m.size?' · ':'')+esc(m.note)+'</small></div><div class=act>'+a+'</div></div>'}
function modelList(list,cur,keyf,useK,dlf){var ins=list.filter(m=>m.installed),av=list.filter(m=>!m.installed);ins.sort((a,b)=>(keyf(b)==cur)-(keyf(a)==cur));
 return (ins.length?'<div class=lbl>'+t('inst')+'</div>'+ins.map(m=>mrow(m,keyf(m),keyf(m)==cur,useK,'')).join(''):'')+(av.length?'<div class=lbl>'+t('avail')+'</div>'+av.map(m=>mrow(m,keyf(m),false,useK,dlf(m))).join(''):'')}
function renderMod(){var h='';
 if(S.missing)h+='<div class=card style="border:2px solid var(--amber)"><h3>'+t('setup')+'</h3><p>'+esc(S.missing)+'</p></div>';
 h+='<div class=card><h3>'+t('wTitle')+'</h3><p class=h>'+t('wHint')+'</p>'+modelList(S.whisperModels||[],S.cfg.modelName,m=>m.file,'modelName',m=>"{cmd:'dlWhisper',file:'"+m.file+"'}")+'</div>';
 if(S.ollama){if(S.activeModel)h+='<div class=card><h3>'+t('lTitle')+'</h3><p class=h>'+t('nowUsing')+'<b>'+esc(S.activeModel)+'</b></p>';
  else h+='<div class=card><h3>'+t('lTitle')+'</h3><p class=err>'+t('noModel')+'</p>';}
 else h+='<div class=card><h3>'+t('lTitle')+'</h3><p class=err>'+t('noOllama')+'</p>';
 h+=modelList(S.llmModels||[],S.cfg.ollamaModel,m=>m.name,'ollamaModel',m=>"{cmd:'dlLLM',name:'"+m.name+"'}")+'</div>';
 h+='<div class=row><button onclick="send({cmd:\'refresh\'})">↻ '+t('refresh')+'</button></div>';document.getElementById('ml').innerHTML=h}
function renderUpd(){var u=S.upd||{},h='';
 if(u.banner)h='<div class=card role=status style="border:4px solid var(--acc)"><h3 style="font-size:22px">'+esc(t('updTitle',u.latest))+'</h3><p class=h>'+esc(t('updInfo',u.cur))+'</p>'+
  '<div class=row><button class=b onclick="send({cmd:\'updOpen\'})">'+esc(t('updSee'))+'</button><button onclick="send({cmd:\'updLater\'})">'+esc(t('updLater'))+'</button>'+
  '<button onclick="send({cmd:\'updSkip\'})">'+esc(t('updSkip'))+'</button></div></div>';
 document.getElementById('upd').innerHTML=h}
function renderPerm(){var p=S.perm||{},h='';
 if(p.ax===false)h+='<div class=card role=alert style="border:4px solid var(--stop)"><h3>'+esc(t('axTitle'))+'</h3><p>'+esc(t('axInfo'))+'</p><p class=h>'+esc(t('axPath',axPane()))+'</p>'+
  '<div class=row><button class="r pl" onclick="send({cmd:\'openAx\'})">'+esc(t('axOpen'))+'</button></div></div>';
 if(p.mic)h+='<div class=card role=alert style="border:4px solid var(--amber)"><h3>'+esc(t('micTitle'))+'</h3><p>'+esc(t('micInfo'))+'</p><p class=h>'+esc(t('micPath'))+'</p>'+
  '<div class=row><button class="y pl" onclick="send({cmd:\'openMic\'})">'+esc(t('micOpen'))+'</button><button onclick="send({cmd:\'hideMic\'})">'+esc(t('hideBanner'))+'</button></div></div>';
 document.getElementById('perm').innerHTML=h}
function render(d){S=d;PEND={};LANG=(d.lang=='es')?'es':'en';lookApply();chrome();renderPerm();renderUpd();histTop();renderHist();var ae=document.activeElement;if(!(ae&&ae.type=='color'))keepInputs(renderSet);renderMod()}
chrome();
if(window.webkit)send({cmd:'refresh'});
</script></body></html>
