<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Taipea</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent!important;overflow:hidden}
/* Colours come from the palette Taipea sends (Settings › Colors); these are the Classic Blue values */
body{--panel:#1C1C20;--bar:#2A2A30;--tabs:#111;--tab:#333;--tabtx:#fff;--btn:#3A3A40;--btntx:#fff;--acc:#0A6CD6;--acctx:#fff;--input:#2A2A30;--inbd:#555;--card:#2C2C32;--inner:#24242A;--tx:#EEE;--mut:#999;--mut2:#AAA;--bd:#3A3A40;--bd2:#444;--ring:#fff;--focus:#0A84FF;--warn:#FFCC00;--sb:#55555A}
body{font:17px -apple-system;color:var(--tx)}
#scroll::-webkit-scrollbar{width:14px}#scroll::-webkit-scrollbar-track{background:transparent}#scroll::-webkit-scrollbar-thumb{background:var(--sb);border-radius:7px;border:3px solid var(--panel)}
#panel{width:100%;height:100%;background:var(--panel);border:2px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
#scroll{flex:1;min-height:0;overflow-y:auto}
#bar{flex:none;height:68px;display:flex;align-items:center;gap:10px;padding:0 12px 0 18px;background:var(--bar);border-bottom:1px solid var(--bd2);cursor:grab;-webkit-user-select:none;z-index:3}
#bar .t{flex:1;font:700 20px -apple-system;padding:4px 0}#bar .t small{font:400 14px -apple-system;color:var(--mut);margin-left:10px}
#bar button{height:60px;min-width:72px;padding:0 14px;font-size:22px}
#tabs{display:flex;gap:8px;padding:12px;background:var(--tabs);position:sticky;top:0;z-index:2}
.tab{flex:1;height:64px;border:0;border-radius:12px;background:var(--tab);color:var(--tabtx);font:700 20px -apple-system;cursor:pointer}
.tab.on{background:var(--acc);color:var(--acctx)}.tab.g{background:#34c759;color:#fff}
section{display:none;padding:14px}section.on{display:block}
button{height:60px;min-width:120px;padding:0 18px;border:0;border-radius:12px;font:700 18px -apple-system;color:var(--btntx);cursor:pointer;background:var(--btn)}
button:hover{filter:brightness(1.25)}body.lt button:hover{filter:brightness(.92)}.b{background:var(--acc);color:var(--acctx)}.g{background:#34c759;color:#fff}.r{background:#ff453a;color:#fff}.y{background:#ff9f0a;color:#fff}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
/* History Copy keeps the fixed copy blue in every colour set (blue = copy) */body:not(.cl) .cpy{background:#0A6CD6;color:#fff}
input[type=text],input[type=number],textarea{font:18px -apple-system;min-height:60px;padding:14px;border-radius:10px;border:1px solid var(--inbd);background:var(--input);color:var(--tx)}
.e{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}.h{color:var(--mut);font-size:14px}
.x{font-size:19px;margin:8px 0;white-space:pre-wrap}
.sty{margin-top:10px}.sty .opt{min-width:110px}.sty .lbl{width:100%;color:var(--mut);font-size:14px}
.e.busy .sty .opt{opacity:.4;pointer-events:none}.conv{color:var(--warn);font-weight:700;font-size:18px}.raw{color:var(--mut2);font-size:15px;margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px}.card h3{margin:0 0 10px}
.opt{flex:1;min-width:130px}.opt.on{background:var(--acc);color:var(--acctx);outline:3px solid var(--ring)}
.m{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--inner);border-radius:10px;padding:12px 16px;margin:8px 0}
.m small{color:var(--mut2);display:block;font-size:14px}.prog{color:var(--warn);font-weight:700}
/* Size: compact scales the whole UI via one variable; the Size card stays full size */
body{--z:1}#bar,#inner{zoom:var(--z)}
body.compact #sizecard,body.compact #langcard{zoom:calc(1/var(--z))}
.big{font:700 22px -apple-system;margin:4px 0}.kd{background:var(--inner);border-radius:10px;padding:14px 16px;margin:8px 0}
.wr{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin:8px 0;align-items:center}.wr input{width:100%}.wh span{color:var(--mut);font-size:14px}
button:disabled{opacity:.45;pointer-events:none}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin:8px 0}
.sw{height:128px;min-width:0;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--inner);border:3px solid transparent;font:700 16px -apple-system;line-height:1.15}
.sw.on{background:var(--acc);color:var(--acctx);border-color:var(--ring);outline:3px solid var(--ring)}
.pv{width:64px;height:64px;flex:none;border-radius:50%;box-sizing:border-box;border:4px solid;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.pv svg{width:52%;height:52%}
.cc{display:grid;grid-template-columns:1fr auto 170px auto;gap:10px;align-items:center;margin:8px 0}
.cc input[type=color]{width:110px;height:64px;padding:2px;border:2px solid var(--inbd);border-radius:12px;background:var(--input);cursor:pointer}
.cc input[type=text]{width:170px}
.pm{flex:1;height:auto;min-height:72px;padding:12px 18px;white-space:normal}
/* High contrast: Classic Blue keeps the black / white / yellow look; other colour sets get thick borders in their own text colour */
body.hc.cl .sw{background:#000;border:3px solid #fff}body.hc.cl .sw.on{background:#ffd60a!important;color:#000;outline:4px solid #fff}body.hc.cl .cc input[type=color]{border:3px solid #fff}
body.hc.cl #panel{background:#000;border:3px solid #fff}body.hc.cl{color:#fff}
body.hc.cl .h,body.hc.cl small,body.hc.cl .raw,body.hc.cl .wh span,body.hc.cl .lbl{color:#fff!important}
body.hc.cl .card,body.hc.cl .e,body.hc.cl .m,body.hc.cl .kd{background:#000;border:2px solid #fff}
body.hc.cl #bar,body.hc.cl #tabs{background:#000;border-bottom:3px solid #fff}
body.hc.cl button{border:3px solid #fff;background:#1a1a1a}body.hc.cl .b{background:#003f8a}body.hc.cl .g{background:#006b1f}body.hc.cl .r{background:#a00000}body.hc.cl .y{background:#7a4a00}
body.hc.cl .tab.on,body.hc.cl .opt.on{background:#ffd60a!important;color:#000;outline:4px solid #fff}
body.hc.cl input[type=text]{background:#000;border:3px solid #fff;color:#fff}
body.hc.cl :focus-visible{outline:4px solid #ffd60a;outline-offset:2px}
body.hc:not(.cl) #panel{border:3px solid var(--tx)}body.hc:not(.cl) #bar,body.hc:not(.cl) #tabs{border-bottom:3px solid var(--tx)}
body.hc:not(.cl) .card,body.hc:not(.cl) .e,body.hc:not(.cl) .m,body.hc:not(.cl) .kd{border:2px solid var(--tx)}
body.hc:not(.cl) button,body.hc:not(.cl) .sw{border:3px solid var(--tx)}body.hc:not(.cl) .tab.on,body.hc:not(.cl) .opt.on,body.hc:not(.cl) .sw.on{outline:4px solid var(--ring)}
body.hc:not(.cl) input[type=text],body.hc:not(.cl) .cc input[type=color]{border:3px solid var(--tx)}body.hc:not(.cl) :focus-visible{outline:4px solid var(--focus);outline-offset:2px}
body.rm *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style></head><body class=cl><div id=panel>
<div id=bar><div class=t>🎙 Taipea<small id=s_drag></small></div><button id=b_hide onclick="send({cmd:'mini'})">—</button><button id=b_close class=r onclick="send({cmd:'close'})">✕</button></div>

<section id=set><div id=sl></div></section>
<section id=mod><div id=ml></div></section>
