name: Feature request
description: Suggest an idea for Taipea.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: Describe the situation or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: rules
    attributes:
      label: Taipea's promises
      options:
        - label: This still works 100% on the Mac, with no cloud service.
        - label: This can be used without a keyboard.
